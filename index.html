function calendarWeather(date){return calendarForecast?assessDay(calendarForecast,date):null}
function calendarSceneSuggestions(date){const a=calendarWeather(date);const firstDate=calendarRows().map(r=>sourceDate(r[0])).filter(Boolean).sort()[0];if(!a||a.cls!=='good'||(firstDate&&date<firstDate))return [];return looseSceneRows().filter(r=>{const txt=norm(r[4]+' '+r[7]);return !/night|nordlys/i.test(r[5]+' '+r[3])&&(r[5]==='DAY')&&weatherLocationFor(r)===calendarLocation}).slice(0,2)}
function calendarCells(){const [year,month]=calendarMonth.split('-').map(Number),first=new Date(year,month-1,1),offset=(first.getDay()+6)%7,days=new Date(year,month,0).getDate(),count=Math.ceil((offset+days)/7)*7,assignments=activeAssignments();return Array.from({length:count},(_,i)=>{const day=i-offset+1;if(day<1||day>days)return '<div class="calendar-outside" aria-hidden="true"></div>';const date=calendarMonth+'-'+String(day).padStart(2,'0'),a=calendarWeather(date),events=assignments.filter(r=>sourceDate(r[0])===date).sort((a,b)=>(a[1]||'99').localeCompare(b[1]||'99')),suggestions=calendarSceneSuggestions(date);return `<button class="calendar-day ${date===calendarSelected?'selected':''} ${(i%7)>=5?'cal-weekend':''}" data-day="${date}" aria-label="${esc(dateLabel(date))}, ${a?a.label:'ingen vejrprognose'}, ${events.length} scener"><span class="cal-daynum ${date===calendarToday?'today':''}">${day}</span>${a?`<span class="cal-weather ${a.cls}">${forecastIcon(a)} ${a.label}<small>${a.rain.toFixed(1)} mm · ${a.wind.toFixed(1)} m/s</small></span>`:`<span class="cal-no-weather">${calendarForecastBusy?'Henter vejr…':'Ingen prognose'}</span>`}${events.map(r=>`<span class="cal-event ${calendarStatus(r)}"><b>${esc(r[1]||'Tid åben')} · ${esc(r[3])}</b><span>${esc(sceneShortName(r[3]))}</span><small>${esc(r[4]||'Status åben')}${tab==='mine'&&person==='Sára Jacobsen'?' · Spille':''}</small></span>`).join('')}${suggestions.length?`<span class="cal-suggestion">☀ Vejrmulighed for ${suggestions.map(r=>esc(r[0])).join(', ')}<small>Ikke planlagt</small></span>`:''}</button>`}).join('')}
function looseDayHTML(){if(selectedLooseScene){const sc=sceneRows().find(r=>r[0]===selectedLooseScene);return `<section class="card"><div class="row"><h2>Uden dato · ${esc(selectedLooseScene)}</h2><button class="button" id="close-loose">Tilbage til dagen</button></div>${sc?sceneLive(sc,tab==='mine'):''}<p></p></section>`}const events=activeAssignments().filter(r=>sourceDate(r[0])===calendarSelected).sort((a,b)=>(a[1]||'99').localeCompare(b[1]||'99')),a=calendarWeather(calendarSelected),suggestions=calendarSceneSuggestions(calendarSelected);return `<section class="card"><div class="row"><h2>${esc(dateLabel(calendarSelected))}</h2></div>${a?`<div class="shoot-weather ${a.cls}">${blockForecastHTML(a,calendarForecast,calendarLocation)}</div>`:'<p class="muted">Ingen vejrprognose til denne dato. Der vises kun en vurdering inden for de syv hentede prognosedage.</p>'}${events.length?events.map(r=>{const sc=sceneRows().find(s=>s[0]===r[3]);return `<article class="scheduled-scene"><div class="row"><h3>${esc(r[1]||'Tid afklares')}${r[2]?' til '+esc(r[2]):''} · ${esc(r[3])}</h3><span class="tag ${calendarStatus(r)==='confirmed'?'green':'amber'}">${esc(r[4]||'Status åben')}</span></div><b>${tab==='mine'&&person==='Sára Jacobsen'?'Spille · ':''}${esc(sc?.[3]||r[3])}</b><p>${esc(r[5]||sc?.[4]||'Location afklares')}<br>${esc(r[6]||'')}</p>${safeMap(r[5]||sc?.[4])}<details><summary>Scene og udstyr</summary>${sc?sceneLive(sc,tab==='mine'):''}</details></article>`}).join(''):'<p>Ingen scener placeret denne dag'+(tab==='mine'?' for '+esc(person):'')+'.</p>'}${suggestions.length?`<div class="weather-opportunity"><h3>Vejrmulighed · ikke en aftale</h3><p>Prognosen for ${esc(calendarLocation)} ser lovende ud. Disse scener uden dato kan vurderes:</p>${suggestions.map(r=>`<p><b>${esc(r[0])} · ${esc(r[3])}</b><br>${esc(r[7]||'')}<br>${esc(r[8]||'')}</p>`).join('')}<small>Placér først scenen i KALENDER, når datoen er valgt. Rekvisitter, adgang og lokale forhold skal stadig afklares.</small></div>`:''}</section>`}

function selectedDayHTML(){
if(selectedLooseScene)return looseDayHTML();
const events=calendarRows().filter(r=>sourceDate(r[0])===calendarSelected&&!/ikke planlagt|aflyst/i.test(r[4]||'')).sort((a,b)=>(a[1]||'99').localeCompare(b[1]||'99'));
const ids=new Set(events.map(r=>r[3])),dayScenes=sceneRows().filter(r=>ids.has(r[0])),gear=sourceTable('GEAR','Scene').rows.filter(r=>ids.has(r[0]));
const crew=sourceTable('TEAM','Navn').rows.filter(p=>dayScenes.some(sc=>participates(sc,p[0]))||gear.some(g=>norm(g[7]).includes(norm(p[0]).split(' ')[0])));
const locs=[...new Set(dayScenes.map(weatherLocationFor).filter(Boolean))];
if(!locs.length)locs.push(calendarLocation);
return `<section class="card call-sheet" aria-label="Dagens call sheet"><div class="row"><div><div class="eyebrow">AI · Call sheet · Hele holdet</div><h2>${esc(dateLabel(calendarSelected))}</h2></div><button class="button call-print" onclick="window.print()">Print</button></div><p class="live-meta">Senest opdateret ${esc(new Date(livePlan.sourceAt).toLocaleString('da-DK',{timeZone:'Atlantic/Faroe'}))} · Alle tider er færøsk lokal tid.</p>${events.length?`<p><b>Første aktivitet ${esc(events[0][1]||'afklares')}</b> · Personlige mødetider fremgår kun, hvis de er angivet i planen.</p>${events.some(r=>calendarStatus(r)!=='confirmed')?'<span class="tag amber">Planen indeholder foreløbige aftaler</span>':''}<h3 class="cs-heading">Dagens plan</h3>${events.map(r=>{const sc=dayScenes.find(s=>s[0]===r[3]);return `<article class="scheduled-scene"><div class="row"><b>${esc(r[1]||'Tid afklares')}${r[2]?' til '+esc(r[2]):''} · ${esc(r[3])}</b><span class="tag ${calendarStatus(r)==='confirmed'?'green':'amber'}">${esc(r[4]||'Status afklares')}</span></div><h3>${esc(sc?.[3]||r[3])}</h3><p>${esc(r[5]||sc?.[4]||'Location afklares')} · ${safeMap(r[5]||sc?.[4])}</p>${r[6]?`<p>${esc(r[6])}</p>`:''}${sc?.[8]?`<p class="muted">Afklaring: ${esc(sc[8])}</p>`:''}</article>`}).join('')}<h3 class="cs-heading">Hold og medvirkende</h3><p class="muted">Tilknyttet dagens scener og udstyr. Endelig deltagelse og mødetider skal bekræftes.</p>${crew.map(p=>`<div class="cs-crew"><b>${esc(p[0])}</b><span>${esc(p[1]||'Rolle afklares')}</span>${/^\+?[\d\s]+$/.test(p[4]||'')?`<a href="tel:${esc(p[4].replace(/\s/g,''))}">${esc(p[4])}</a>`:''}</div>`).join('')||'<p>Holdet er ikke angivet for dagens scener.</p>'}<h3 class="cs-heading">Udstyr og rekvisitter</h3>${gear.map(g=>`<div class="scheduled-scene"><b>${esc(g[0])} · ${esc(g[8]||'Status afklares')}</b>${[['Billede',g[3]],['Lyd',g[4]],['Lys, strøm og streaming',g[5]],['Rekvisitter',g[6]],['Ansvar',g[7]]].filter(x=>x[1]).map(([k,v])=>`<p><b>${k}:</b> ${esc(v)}</p>`).join('')}</div>`).join('')||'<p>Udstyr er endnu ikke angivet.</p>'}`:'<p>Ingen optagelser planlagt denne dag.</p>'}<h3 class="cs-heading">Vejr og sol</h3>${locs.map(loc=>{const f=homeForecasts.get(loc),a=f?assessDay(f,calendarSelected):null;return a?`<div class="shoot-weather ${a.cls}">${blockForecastHTML(a,f,loc)}</div>`:`<p class="muted">${esc(loc)}: Ingen tilgængelig prognose eller soltider for denne dato.</p>`}).join('')}<p class="live-meta">Vejret vurderes i dagslys mellem kl. 08:00 og 16:00. Prognosen dækker syv dage.</p></section>`;
}

function personalTaskPanel(){
if(tab!=='mine'||person==='Sára Jacobsen')return '';
const all=personalTasks(person),pending=all.filter(r=>!isDone(r[2])),done=all.filter(r=>isDone(r[2]));
const item=r=>`<article class="my-task"><div class="row"><h3>${esc(r[0]||'Opgave')}</h3><span class="tag amber">${esc(r[2]||'Åben')}</span></div><p class="my-task-deadline"><b>Frist:</b> ${esc(r[3]||'Afklares')}</p>${r[4]?`<p>${esc(r[4])}</p>`:''}<small class="muted">Ansvar: ${esc(r[1]||'Afklares')}</small></article>`;
return `<section class="card my-tasks" aria-label="Dine opgaver"><div class="eyebrow">${esc(person)}</div><div class="row"><h2>Dine opgaver før optagelse</h2></div>${pending.length?pending.map(item).join(''):'<p>Ingen åbne opgaver registreret til dig.</p>'}${done.length?`<details><summary>Afsluttede opgaver (${done.length})</summary>${done.map(taskLive).join('')}</details>`:''}<p class="live-meta">Opgaverne følger produktionsplanen. Status opdateres i regnearket.</p></section>`;
}

function calendarHTML(){const [y,m]=calendarMonth.split('-').map(Number),label=new Date(y,m-1,1).toLocaleDateString('da-DK',{month:'long',year:'numeric'}),loose=looseSceneRows();return `${personalTaskPanel()}<div class="calendar-toolbar"><div><div class="eyebrow">${tab==='mine'?esc(person):'Hele produktionen'}</div><h2>${esc(label)}</h2></div><div class="calendar-controls"><button class="button" id="cal-prev" aria-label="Forrige måned">‹</button><button class="button" id="cal-today">I dag</button><button class="button" id="cal-next" aria-label="Næste måned">›</button><button class="button" id="cal-scope">${tab==='mine'?'Vis alle':'Mit skema'}</button></div></div><div class="calendar-weather-bar"><label for="cal-location">Vejr for </label><select id="cal-location">${Object.keys(locations).map(l=>`<option ${l===calendarLocation?'selected':''}>${esc(l)}</option>`).join('')}</select><button class="button" id="cal-weather-refresh" ${calendarForecastBusy?'disabled':''}>${calendarForecastBusy?'Henter…':'Opdatér vejr'}</button><span class="muted">${calendarForecast?'<span class="weather-dot good"></span>Lovende <span class="weather-dot mid"></span>Usikkert <span class="weather-dot bad"></span>Ugunstigt':'Syv dages prognose'}</span></div>${calendarWeatherError?`<div class="notice">${esc(calendarWeatherError)}</div>`:''}<div class="calendar-layout"><section><div class="calendar-shell"><div class="calendar-weekdays">${['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'].map(d=>`<span>${d}</span>`).join('')}</div><div class="calendar-month">${calendarCells()}</div></div><p class="live-meta">Vejrfarver gælder ${esc(calendarLocation)} i dagslys kl. 08:00 til 16:00. Klik på en dato for detaljer. Stiplet: forslag. Grøn scene: fast dato eller bekræftet. ${calendarForecast?'Vejr hentet '+new Date(calendarForecast.at).toLocaleTimeString('da-DK',{timeZone:'Atlantic/Faroe',hour:'2-digit',minute:'2-digit'}):''}</p><div id="calendar-detail">${selectedDayHTML()}</div></section><aside class="unscheduled"><h2>Uden dato <span class="tag">${loose.length}</span></h2><p class="muted">Disse scener er endnu ikke placeret i kalenderen.</p>${loose.map(r=>`<button class="loose-scene" data-loose="${esc(r[0])}"><span class="tag">${esc(r[0])}</span><b>${esc(r[3])}</b><small>${esc(r[4]||'Location afklares')}</small></button>`).join('')||'<p>Alle scener har en dato.</p>'}</aside></div>`}
function bindCalendar(){const changeMonth=delta=>{const [y,m]=calendarMonth.split('-').map(Number),d=new Date(y,m-1+delta,1);calendarMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;selectedLooseScene=null;render()};$('#cal-prev').onclick=()=>changeMonth(-1);$('#cal-next').onclick=()=>changeMonth(1);$('#cal-today').onclick=()=>{calendarMonth=calendarToday.slice(0,7);calendarSelected=calendarToday;selectedLooseScene=null;render()};$('#cal-scope').onclick=()=>{tab=tab==='mine'?'home':'mine';render()};$('#cal-location').onchange=e=>{calendarLocation=e.target.value;calendarForecast=null;loadCalendarWeather()};$('#cal-weather-refresh').onclick=()=>loadCalendarWeather(true);document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{calendarSelected=b.dataset.day;selectedLooseScene=null;render();$('#calendar-detail').scrollIntoView({behavior:'smooth',block:'start'});loadCallSheetWeather()});document.querySelectorAll('[data-loose]').forEach(b=>b.onclick=()=>{selectedLooseScene=b.dataset.loose;render();$('#calendar-detail').scrollIntoView({behavior:'smooth',block:'start'})});if($('#close-loose'))$('#close-loose').onclick=()=>{selectedLooseScene=null;render()};if(!calendarForecast&&!calendarForecastBusy&&!calendarWeatherError)loadCalendarWeather()}
async function loadCalendarWeather(force=false){const run=++calendarWeatherRequest;calendarForecastBusy=true;calendarWeatherError='';render();try{const f=await getHomeForecast(calendarLocation,force);if(run!==calendarWeatherRequest)return;calendarForecast=f}catch{if(run!==calendarWeatherRequest)return;calendarForecast=null;calendarWeatherError='Vejret kunne ikke hentes. Datoerne vises uden vejrbedømmelse.'}finally{if(run===calendarWeatherRequest){calendarForecastBusy=false;render()}}}
function render(){if(!livePlan||!['home','mine'].includes(tab)){renderSourceViews();return}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#title').textContent=tab==='mine'?'Mit skema':'Produktionskalender';$('#view').innerHTML=calendarHTML();syncNotice();bindCalendar()}
setInterval(()=>{if(['home','mine'].includes(tab))loadCalendarWeather(true)},1800000);
async function loadCallSheetWeather(){const locs=[...new Set(calendarRows().filter(r=>sourceDate(r[0])===calendarSelected).map(r=>sceneRows().find(sc=>sc[0]===r[3])).filter(Boolean).map(weatherLocationFor).filter(Boolean))];await Promise.allSettled(locs.map(loc=>getHomeForecast(loc,false)));if(['home','mine'].includes(tab)&&!selectedLooseScene&&$('#calendar-detail'))$('#calendar-detail').innerHTML=selectedDayHTML()}
render();refreshProduction();

</script></html>
